rules:
  - path: /tmp/lab/tmp
    max_age_days: 7
    min_size_kb: 4
  - path: /tmp/lab/logs
    max_age_days: 30
    pattern: "**/*.log.*"
  - path: /tmp/lab/releases
    max_age_days: 14
    pattern: "**/build.tar"
    keep_newest: 3
  - path: /home
    max_age_days: 1
protect:
  - "**/.git/**"
  - "**/*.pid"
